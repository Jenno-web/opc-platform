services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opc
      POSTGRES_PASSWORD: opc
      POSTGRES_DB: opc
    ports:
      - "5432:5432"
    volumes:
      - opc_postgres_data:/var/lib/postgresql/data

volumes:
  opc_postgres_data:
